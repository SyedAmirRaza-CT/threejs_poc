<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Three.js Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: sans-serif;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            display: none; /* Hide by default, Flutter will handle custom loading */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Loading...</p>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, currentModel;
        let mixer, clock;
        let actions = {};
        let isLoading = false;
        let lastLoadedPath = "";
        let enableBoundaries = true;

        const loader = new GLTFLoader();

        init();
        animate();

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Add boundaries to panning so model doesn't disappear
            controls.addEventListener('change', () => {
                if (!currentModel || !enableBoundaries) return;

                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // Allow panning only within 1.5x the size of the model
                const limitX = size.x * 1.5;
                const limitY = size.y * 1.5;
                const limitZ = size.z * 1.5;

                controls.target.x = THREE.MathUtils.clamp(controls.target.x, center.x - limitX, center.x + limitX);
                controls.target.y = THREE.MathUtils.clamp(controls.target.y, center.y - limitY, center.y + limitY);
                controls.target.z = THREE.MathUtils.clamp(controls.target.z, center.z - limitZ, center.z + limitZ);
            });

            const ambientLight = new THREE.AmbientLight(0xffffff, 2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            directionalLight.shadow.bias = -0.001;
            scene.add(directionalLight);

            window.addEventListener('resize', onWindowResize, false);

            window.loadModelWithConfig = function(modelPath, bgColor, initialZoom, enableZoom, autoPlay, cameraPos, targetPos, enableRotate, enablePan, showNativeLoader, minZoom, maxZoom, boundariesEnabled) {
                if (isLoading || lastLoadedPath === modelPath) return;

                isLoading = true;
                lastLoadedPath = modelPath;
                enableBoundaries = (boundariesEnabled !== undefined) ? boundariesEnabled : true;

                if (bgColor) {
                    if (bgColor === 'transparent' || bgColor === '#00000000') {
                        scene.background = null;
                        renderer.setClearColor(0x000000, 0);
                        document.body.style.backgroundColor = 'transparent';
                    } else {
                        scene.background = new THREE.Color(bgColor);
                        document.body.style.backgroundColor = bgColor;
                        renderer.setClearColor(bgColor, 1);
                    }
                }

                controls.enableZoom = (enableZoom !== undefined) ? enableZoom : true;
                controls.enableRotate = (enableRotate !== undefined) ? enableRotate : true;
                controls.enablePan = (enablePan !== undefined) ? enablePan : true;

                if (currentModel) {
                    scene.remove(currentModel);
                    currentModel.traverse(child => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    });
                }
                if (mixer) {
                    mixer.stopAllAction();
                    mixer = null;
                    actions = {};
                }

                if (showNativeLoader) {
                    document.getElementById('loading').style.display = 'flex';
                }

                if (window.flutter_inappwebview) {
                    window.flutter_inappwebview.callHandler('onLoadStart');
                }

                loader.load(modelPath, function (gltf) {
                    currentModel = gltf.scene;
                    currentModel.traverse(function (object) {
                        if (object.isMesh) {
                            object.castShadow = true;
                            if (object.isSkinnedMesh) object.frustumCulled = false;
                        }
                    });

                    scene.add(currentModel);
                    document.getElementById('loading').style.display = 'none';
                    isLoading = false;

                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(currentModel);
                        const animationList = gltf.animations.map(clip => {
                            const action = mixer.clipAction(clip);
                            actions[clip.name] = action;
                            action.play();
                            if (!autoPlay) action.paused = true;
                            return { name: clip.name, duration: clip.duration };
                        });
                        if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('onAnimationsLoaded', animationList);
                    }

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    const maxSize = Math.max(size.x, size.y, size.z);

                    // Base distance for framing
                    const fitHeightDistance = maxSize / (2 * Math.atan(Math.PI * camera.fov / 360));
                    const fitWidthDistance = fitHeightDistance / camera.aspect;
                    const baseDistance = Math.max(fitHeightDistance, fitWidthDistance);

                    if (cameraPos && cameraPos.x !== undefined) {
                        camera.position.set(cameraPos.x, cameraPos.y, cameraPos.z);
                    } else {
                        const zoomFactor = (initialZoom || 1.0);
                        const distance = (1.2 / zoomFactor) * baseDistance;
                        camera.position.copy(center);
                        camera.position.z += distance;
                    }

                    if (targetPos && targetPos.x !== undefined) {
                        controls.target.set(targetPos.x, targetPos.y, targetPos.z);
                    } else {
                        controls.target.copy(center);
                    }

                    // Set zoom limits
                    if (minZoom !== undefined && minZoom !== null) {
                        controls.maxDistance = baseDistance * (2.0 / minZoom);
                    } else {
                        controls.maxDistance = 5000;
                    }

                    if (maxZoom !== undefined && maxZoom !== null) {
                        controls.minDistance = baseDistance * (0.1 / maxZoom);
                    } else {
                        controls.minDistance = 0.01;
                    }

                    camera.lookAt(controls.target);
                    controls.update();

                    if (window.flutter_inappwebview) {
                        window.flutter_inappwebview.callHandler('onLoadComplete');
                    }

                }, (xhr) => {
                    if (xhr.lengthComputable) {
                        const percent = Math.round(xhr.loaded / xhr.total * 100);
                        if (showNativeLoader) {
                            document.getElementById('loading-text').innerText = "Loading: " + percent + "%";
                        }
                        if (window.flutter_inappwebview) {
                            window.flutter_inappwebview.callHandler('onLoadProgress', percent);
                        }
                    }
                }, (error) => {
                    console.error('JS Load Error:', error);
                    isLoading = false;
                    lastLoadedPath = "";
                    if (window.flutter_inappwebview) {
                        window.flutter_inappwebview.callHandler('onLoadError', error.toString());
                    }
                });
            };

            window.toggleAnimation = function(play) {
                if (!mixer) return;
                for (let key in actions) actions[key].paused = !play;
            };

            window.setAnimationProgress = function(name, progress) {
                if (actions[name]) {
                    const action = actions[name];
                    action.paused = true;
                    action.time = action.getClip().duration * progress;
                    mixer.update(0);
                }
            };

            if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('onViewerReady');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
